name: Action end-to-end

on:
  workflow_dispatch:
    inputs:
      core-version:
        description: Public ReleaseCheck core version without v
        required: true
        default: 0.1.0
      ecosystem:
        description: npm or pypi
        required: true
        default: npm
      package:
        description: Public package to verify
        required: true
      expected-exit-code:
        description: Expected ReleaseCheck exit code, usually 0 or 1
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run ReleaseCheck through the local Action
        id: releasecheck
        continue-on-error: true
        uses: ./
        with:
          ecosystem: ${{ inputs.ecosystem }}
          package: ${{ inputs.package }}
          releasecheck-version: ${{ inputs.core-version }}
          format: json
          output: releasecheck-report.json
      - name: Assert expected verifier status and report
        shell: bash
        env:
          ACTUAL: ${{ steps.releasecheck.outcome == 'success' && '0' || '1' }}
          EXPECTED: ${{ inputs.expected-exit-code }}
        run: |
          test -s releasecheck-report.json
          test "$ACTUAL" = "$EXPECTED"
          grep -q '"verdict"' releasecheck-report.json
      - name: Upload report for review
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.3
        with:
          name: releasecheck-action-report
          path: releasecheck-report.json
