name: Action CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate required action gate
        run: bash tests/validate-action.sh

  platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate action structure
        if: runner.os != 'Windows'
        run: bash tests/validate-action.sh
      - name: Validate Windows runner script
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/validate-action.ps1
